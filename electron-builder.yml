appId: app.labhub.desktop
productName: LabHub
copyright: Copyright © LabHub
directories:
  output: release/electron
files:
  - desktop/**/*
  - package.json
extraResources:
  - from: release/app-resources/server
    to: server
  - from: client/dist
    to: client
  - from: config/public.json
    to: config/public.json
asar: true
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: LabHub-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  shortcutName: LabHub
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  include: build/installer.nsh
